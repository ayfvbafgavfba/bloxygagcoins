services:
  - type: web_service
    name: growcsn-backend
    env: node
    nodeVersion: 18.20.0
    region: oregon
    plan: free
    rootDir: growcsn-backend
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm ci --include=dev --no-audit --no-fund --prefix ../growcsn-frontend && npm run --prefix ../growcsn-frontend build
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVER_PORT
        value: 10000
      - key: SERVER_FRONTEND_URL
        value: https://bloxygag.org
      - key: SERVER_BACKEND_URL
        value: https://bloxygag.org
      - key: VUE_APP_BACKEND_URL
        value: https://bloxygag.org
      - key: VUE_APP_SOCKET_URL
        value: wss://bloxygag.org
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URI
        sync: false
      - key: HCAPTCHA_SECRET
        sync: false
      - key: VUE_APP_HCAPTCHA_KEY
        sync: false
      - key: CAPTCHA_SECRET
        sync: false
      - key: TOKEN_SECRET
        value: replace-me
      - key: TOKEN_EXPIRE
        value: 1w
      - key: BOT_KEY
        sync: false
      - key: VITE_API_URL
        value: https://bloxygag.org
      - key: VITE_SOCKET_URL
        value: https://bloxygag.org


