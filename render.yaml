services:
  - type: web_service
    name: bloxygagcoin-backend
    env: node
    region: oregon
    plan: free
    rootDir: growcsn-backend
    nodeVersion: 18.18.0
    buildCommand: cd ../growcsn-frontend && npm ci --include=dev --no-audit --no-fund && npm run build && cd ../growcsn-backend && npm ci --include=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVER_PORT
        value: 10000
      - key: SERVER_FRONTEND_URL
        value: https://bloxgag.org,https://www.bloxgag.org,https://bloxygagcoins.onrender.com
      - key: SERVER_BACKEND_URL
        value: https://bloxgag.org
      - key: VITE_API_URL
        value: https://bloxgag.org
      - key: VITE_SOCKET_URL
        value: https://bloxgag.org
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URI
        sync: false
      - key: HCAPTCHA_SECRET
        sync: false
      - key: CAPTCHA_SECRET
        sync: false
      - key: TOKEN_SECRET
        value: replace-me
      - key: TOKEN_EXPIRE
        value: 1w
      - key: BOT_KEY
        sync: false


